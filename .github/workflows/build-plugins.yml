name: Build plugins

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ninja

      - name: Build and package
        run: scripts/build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoplug-1.5.0-macos-universal
          path: dist/protoplug-1.5.0-macos-universal.zip

  build-linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            build-essential \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Build and package
        run: scripts/build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoplug-1.5.0-linux-x64
          path: dist/protoplug-1.5.0-linux-x64.zip

  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and package
        shell: pwsh
        run: scripts/build-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoplug-1.5.0-windows-x64
          path: dist/protoplug-1.5.0-windows-x64.zip
